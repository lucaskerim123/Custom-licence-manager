name: OrbitFS Base Release Integration CI

on:
  push:
    branches: [orbitfs-base-release-integration]
  pull_request:
    branches: [orbitfs-base-release-integration]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
