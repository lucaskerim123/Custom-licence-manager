name: ChatGPT Deployment Override

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: chatgpt-deployment-override
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.event.issue.user.login == 'lucaskerim123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Parse one-shot deployment target
        id: target
        shell: bash
        env:
          COMMAND: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            "DEPLOY NOW LM"|"DEPLOY LM NOW") echo "target=lm" >> "$GITHUB_OUTPUT" ;;
            "DEPLOY NOW V2"|"DEPLOY V2 NOW") echo "target=v2" >> "$GITHUB_OUTPUT" ;;
            "DEPLOY NOW"|"DEPLOY NOW BOTH"|"DEPLOY BOTH NOW") echo "target=both" >> "$GITHUB_OUTPUT" ;;
            *) echo "target=invalid" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reject invalid command and close request
        if: steps.target.outputs.target == 'invalid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "No deployment executed. Valid commands: DEPLOY NOW, DEPLOY BOTH NOW, DEPLOY NOW V2, DEPLOY NOW LM."
          gh issue close "$ISSUE_NUMBER"

      - name: Dispatch V2 Billing Store production deployment
        if: steps.target.outputs.target == 'v2' || steps.target.outputs.target == 'both'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_ACTIONS_TOKEN"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucaskerim123/V2_Billing_Store/actions/workflows/production-deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Dispatch License Manager production deployment
        if: steps.target.outputs.target == 'lm' || steps.target.outputs.target == 'both'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_ACTIONS_TOKEN"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucaskerim123/Custom-licence-manager/actions/workflows/production-deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Record and close one-shot override request
        if: steps.target.outputs.target != 'invalid'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --body "OVERRIDE DEPLOY dispatched from main. One-shot authorization only; Vercel Git auto-deploy remains disabled."
          gh issue close "$ISSUE_NUMBER"