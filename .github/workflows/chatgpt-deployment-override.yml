name: ChatGPT Deployment Override

on:
  push:
    branches: [main]
    paths:
      - '.github/chatgpt-deploy-request.json'

permissions:
  contents: read

concurrency:
  group: chatgpt-deployment-override
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ github.actor == 'lucaskerim123' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read one-shot deployment request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/chatgpt-deploy-request.json').read_text())
          target = data.get('target')
          request_id = data.get('request_id')
          if target not in {'none', 'lm', 'v2', 'both'}:
              raise SystemExit(f'Invalid deployment target: {target!r}')
          if not request_id:
              raise SystemExit('Missing deployment request_id')
          Path('/tmp/request.env').write_text(f'TARGET={target}\\nREQUEST_ID={request_id}\\n')
          PY
          cat /tmp/request.env >> "$GITHUB_OUTPUT"

      - name: Dispatch V2 Billing Store production deployment
        if: steps.request.outputs.TARGET == 'v2' || steps.request.outputs.TARGET == 'both'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_ACTIONS_TOKEN"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucaskerim123/V2_Billing_Store/actions/workflows/production-deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Dispatch License Manager production deployment
        if: steps.request.outputs.TARGET == 'lm' || steps.request.outputs.TARGET == 'both'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_ACTIONS_TOKEN"
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucaskerim123/Custom-licence-manager/actions/workflows/production-deploy.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Record one-shot request
        run: |
          echo "OVERRIDE DEPLOY dispatched: target=${{ steps.request.outputs.TARGET }} request=${{ steps.request.outputs.REQUEST_ID }} commit=${GITHUB_SHA}"