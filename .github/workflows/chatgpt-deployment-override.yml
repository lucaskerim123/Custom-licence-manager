name: ChatGPT Deployment Override

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    if: ${{ github.actor == 'lucaskerim123' && startsWith(github.event.issue.title, 'DEPLOY NOW') }}
    runs-on: ubuntu-latest
    steps:
      - name: Parse one-shot deployment target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          title="${{ github.event.issue.title }}"
          case "$title" in
            "DEPLOY NOW LM") echo "repo=lucaskerim123/Custom-licence-manager" >> "$GITHUB_OUTPUT" ;;
            "DEPLOY NOW V2") echo "repo=lucaskerim123/V2_Billing_Store" >> "$GITHUB_OUTPUT" ;;
            "DEPLOY NOW"|"DEPLOY NOW BOTH") echo "repo=both" >> "$GITHUB_OUTPUT" ;;
            *) echo "repo=invalid" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reject invalid override command
        if: steps.target.outputs.repo == 'invalid'
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Override not executed. Valid one-shot commands are DEPLOY NOW, DEPLOY NOW V2, or DEPLOY NOW LM."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch V2 Billing Store production deployment
        if: steps.target.outputs.repo == 'lucaskerim123/V2_Billing_Store' || steps.target.outputs.repo == 'both'
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/lucaskerim123/V2_Billing_Store/actions/workflows/production-deploy.yml/dispatches             -d '{"ref":"main"}'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}

      - name: Dispatch License Manager production deployment
        if: steps.target.outputs.repo == 'lucaskerim123/Custom-licence-manager' || steps.target.outputs.repo == 'both'
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_ACTIONS_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             https://api.github.com/repos/lucaskerim123/Custom-licence-manager/actions/workflows/production-deploy.yml/dispatches             -d '{"ref":"main"}'
        env:
          GITHUB_ACTIONS_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN }}

      - name: Record and close one-shot override request
        if: steps.target.outputs.repo != 'invalid'
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" --body "OVERRIDE DEPLOY dispatched for ${{ steps.target.outputs.repo }}. This was a one-shot deployment authorization; it does not enable Vercel Git auto-deploy or change the normal deployment gate."
          gh issue close "${{ github.event.issue.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
