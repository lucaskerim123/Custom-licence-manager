name: License Master CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: license-master-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run complete production validation
        run: npm run preflight
      - name: Upload temporary validation failure report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-failure-${{ github.sha }}
          path: .orbitfs-validation/validation-error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Production gate passed
        run: echo "CI production gate passed."
