name: License Master CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: license-master-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check whitespace and patch integrity
        run: git diff --check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Generate complete release/change-set manifest
        run: node scripts/release-manifest.mjs

      - name: Upload release/change-set manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-change-set-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Production gate passed
        run: echo "CI production gate passed."
