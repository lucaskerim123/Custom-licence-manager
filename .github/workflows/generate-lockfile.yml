name: Generate Lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lockfile-main
  cancel-in-progress: true

jobs:
  lockfile:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Synchronize lockfile with package manifest
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json

      - name: Verify locked install
        run: npm ci --ignore-scripts

      - name: Commit lockfile only when it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && test -z "$(git status --porcelain -- package-lock.json)"; then
            echo "No lockfile change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "Synchronize npm lockfile"
          git push origin HEAD:main
